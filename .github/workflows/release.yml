# main에 올리면 맥/윈도우 빌드와 테스트만 돌고,
# v로 시작하는 태그(예: v0.1.0)를 올리면 빌드한 파일로 GitHub 릴리즈까지 만든다.
name: 빌드 및 릴리즈

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 소스 테스트
        run: python scripts/smoke.py

      - name: PyInstaller 설치
        run: python -m pip install pyinstaller

      - name: Inno Setup 확인 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # 저장소 Secrets에 인증서가 있으면 맥 앱을 Developer ID로 서명한다. 없으면 임시 서명으로 넘어간다.
      - name: 서명 인증서 준비 (맥)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [[ -z "$MAC_CERT_P12" ]]; then echo "인증서 없음 → 임시 서명으로 빌드"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychain -d user -s "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -n1 | sed -E 's/.*"(.*)".*/\1/')"
          if [[ -z "$ID" ]]; then echo "::error::p12 안에 'Developer ID Application' 인증서가 없어요"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "서명: $ID"

      # 공증은 몇 분 걸려서 릴리즈(태그) 때만 한다
      - name: 앱 빌드
        env:
          NOTARY_APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOTARY_APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOTARY_PASSWORD || '' }}
          NOTARY_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOTARY_TEAM_ID || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="0.0.0-dev.${GITHUB_SHA::7}"; fi
          python scripts/build.py --version "$VERSION"

      - name: 배포판 테스트
        run: python scripts/smoke.py --built

      - uses: actions/upload-artifact@v4
        with:
          name: gihoek-wiki-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 릴리즈 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "기획위키 $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
